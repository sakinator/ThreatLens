<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyber Shield Neon Border -->
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>

    <!-- Hostile Malware Bug Red/Crimson Gradient -->
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF0040" />
    </linearGradient>

    <!-- Lens Glass Radial Highlight -->
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00B0FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0058FF" stop-opacity="0.05" />
    </radialGradient>

    <!-- Lens Rim Metallic Gradient -->
    <linearGradient id="lensRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Base Plate -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- ==================== 1. SECURITY SHIELD ==================== -->
  <!-- Outer Cyber Armor Shield -->
  <polygon points="256,42 432,96 432,260 256,468 80,260 80,96"
           fill="url(#shieldPlate)"
           stroke="url(#neonCyanGrad)"
           stroke-width="10"
           stroke-linejoin="round"
           filter="url(#cyanGlow)" />

  <!-- Inner Shield Bevel Accent Line -->
  <polygon points="256,72 404,118 404,248 256,432 108,248 108,118"
           fill="none"
           stroke="#1E293B"
           stroke-width="4"
           stroke-linejoin="round" />

  <!-- Shield Circuit / Hex Grid Background Accents -->
  <path d="M180,140 L256,180 L332,140 M180,320 L256,280 L332,320 M256,180 L256,280"
        stroke="#0F2444" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- ==================== 2. MALWARE BUG (ON THE SHIELD) ==================== -->
  <g id="malware-bug" filter="url(#redGlow)">
    <!-- Bug Antennae -->
    <path d="M216,168 C206,145 190,140 180,146" stroke="#FF0055" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M244,168 C254,145 270,140 280,146" stroke="#FF0055" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <circle cx="180" cy="146" r="4" fill="#FF0055" />
    <circle cx="280" cy="146" r="4" fill="#FF0055" />

    <!-- 6 Bug Legs (Jointed Cyber Beetle Legs) -->
    <!-- Top Left & Right -->
    <path d="M198,195 L156,180 L140,195" stroke="#FF0055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M262,195 L304,180 L320,195" stroke="#FF0055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Middle Left & Right -->
    <path d="M192,230 L144,232 L132,254" stroke="#FF0055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M268,230 L316,232 L328,254" stroke="#FF0055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Bottom Left & Right -->
    <path d="M198,265 L152,284 L146,312" stroke="#FF0055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M262,265 L308,284 L314,312" stroke="#FF0055" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Bug Head -->
    <ellipse cx="230" cy="178" rx="18" ry="14" fill="#FF0055" />

    <!-- Bug Thorax (Middle Plate) -->
    <rect x="206" y="196" width="48" height="30" rx="8" fill="url(#bugGrad)" />

    <!-- Bug Abdomen (Segmented Shell) -->
    <path d="M202,232 C202,232 230,228 258,232 C266,252 264,285 230,305 C196,285 194,252 202,232 Z" fill="url(#bugGrad)" />

    <!-- Shell Wing Divider & Tech Seams -->
    <line x1="230" y1="230" x2="230" y2="303" stroke="#0B1120" stroke-width="3" stroke-linecap="round" />
    <line x1="208" y1="262" x2="252" y2="262" stroke="#0B1120" stroke-width="2.5" />

    <!-- Bug Glowing Infected Core / Malware Pulse -->
    <circle cx="230" cy="254" r="6" fill="#FFFFFF" />
    <circle cx="230" cy="254" r="3" fill="#FF0055" />
  </g>

  <!-- ==================== 3. MAGNIFYING GLASS (LENS FOCUSING ON BUG) ==================== -->
  <g id="magnifying-lens">
    <!-- Magnifier Cyber Handle (Angled downwards to bottom right) -->
    <line x1="316" y1="316" x2="416" y2="416" stroke="#00E5FF" stroke-width="24" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="316" y1="316" x2="416" y2="416" stroke="#0A1628" stroke-width="14" stroke-linecap="round" />
    <line x1="352" y1="352" x2="410" y2="410" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" />
    <!-- Handle Grip Notches -->
    <line x1="362" y1="372" x2="372" y2="362" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" />
    <line x1="382" y1="392" x2="392" y2="382" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" />

    <!-- Handle Connector Joint Ring -->
    <circle cx="316" cy="316" r="14" fill="#00E5FF" />
    <circle cx="316" cy="316" r="8" fill="#0A1628" />

    <!-- Magnifier Lens Rim (Heavy Tactical Metallic Rim) -->
    <circle cx="230" cy="230" r="105" fill="none" stroke="url(#lensRimGrad)" stroke-width="16" filter="url(#cyanGlow)" />
    <circle cx="230" cy="230" r="113" fill="none" stroke="#00E5FF" stroke-width="2" />

    <!-- Lens Glass Surface Highlight -->
    <circle cx="230" cy="230" r="97" fill="url(#lensGlass)" />

    <!-- Lens Arc Glass Reflection Streak -->
    <path d="M165,160 C185,145 220,140 255,145" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.75" fill="none" />
    <path d="M152,185 C162,175 178,168 195,165" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.5" fill="none" />

    <!-- ==================== 4. TACTICAL RETICLE / FOCUS CROSSHAIRS ==================== -->
    <!-- Concentric Target Sight -->
    <circle cx="230" cy="230" r="75" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="14 10" stroke-opacity="0.85" />
    
    <!-- Precision Crosshairs Framing the Bug -->
    <line x1="230" y1="135" x2="230" y2="155" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="230" y1="305" x2="230" y2="325" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="135" y1="230" x2="155" y2="230" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="305" y1="230" x2="325" y2="230" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />

    <!-- Target Corner Brackets [ ] -->
    <path d="M185,195 L185,185 L195,185" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M275,195 L275,185 L265,185" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M185,265 L185,275 L195,275" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M275,265 L275,275 L265,275" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
