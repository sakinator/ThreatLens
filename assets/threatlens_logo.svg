<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0058FF" />
    </linearGradient>

    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0058FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="100" fill="#050811"/>

  <!-- Outer Tactical Cyber Shield (Beveled Hard-Edge Geometry) -->
  <polygon points="256,36 448,96 448,276 256,476 64,276 64,96" 
           fill="url(#shieldGrad)" 
           stroke="url(#neonCyanGrad)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Armor Inset Frame -->
  <polygon points="256,66 420,118 420,266 256,438 92,266 92,118" 
           fill="none" 
           stroke="#1E293B" 
           stroke-width="5" 
           stroke-linejoin="round"/>

  <!-- Ambient Lens Optical Glow -->
  <circle cx="256" cy="246" r="140" fill="url(#lensGlow)" />

  <!-- Outer HUD Reticle Ring -->
  <circle cx="256" cy="246" r="128" 
          fill="none" 
          stroke="#0058FF" 
          stroke-width="4" 
          stroke-dasharray="16 8"/>

  <!-- Camera Lens Outer Chasis Ring -->
  <circle cx="256" cy="246" r="105" 
          fill="#080E1A" 
          stroke="url(#neonCyanGrad)" 
          stroke-width="9"/>

  <!-- Interlocking Camera Aperture Iris Blades (Hexagonal Lens Shutter) -->
  <polygon points="206,160 306,160 346,246 286,332 186,332 146,246" 
           fill="none" 
           stroke="url(#neonGreenGrad)" 
           stroke-width="7" 
           stroke-linejoin="round"/>

  <line x1="206" y1="160" x2="286" y2="332" stroke="url(#neonGreenGrad)" stroke-width="6"/>
  <line x1="306" y1="160" x2="186" y2="332" stroke="url(#neonGreenGrad)" stroke-width="6"/>
  <line x1="146" y1="246" x2="346" y2="246" stroke="url(#neonGreenGrad)" stroke-width="6"/>

  <!-- Inner Iris Aperture Void -->
  <circle cx="256" cy="246" r="42" fill="#020617" stroke="#00E5FF" stroke-width="4"/>

  <!-- Glowing Sensor Core (Threat Target) -->
  <circle cx="256" cy="246" r="22" fill="url(#neonCyanGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="246" r="8" fill="#FFFFFF"/>

  <!-- Tactical Crosshair Sights -->
  <line x1="256" y1="96" x2="256" y2="132" stroke="#00E5FF" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="360" x2="256" y2="396" stroke="#00E5FF" stroke-width="8" stroke-linecap="round"/>
  <line x1="106" y1="246" x2="142" y2="246" stroke="#00E5FF" stroke-width="8" stroke-linecap="round"/>
  <line x1="370" y1="246" x2="406" y2="246" stroke="#00E5FF" stroke-width="8" stroke-linecap="round"/>
</svg>
