<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="100%" stop-color="#0A1020" />
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111B2E" />
      <stop offset="60%" stop-color="#0C1322" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>

    <!-- Shield Neon Border Gradient -->
    <linearGradient id="shieldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <!-- Bug Gradient -->
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF0044" />
    </linearGradient>

    <!-- Magnifier Lens Rim Gradient -->
    <linearGradient id="lensRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0052FF" />
    </linearGradient>

    <!-- Lens Glass Gradient -->
    <radialGradient id="lensGlass" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0088FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0033AA" stop-opacity="0.04" />
    </radialGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="bugGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Rounded Canvas Plate -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- ==================== 1. SMOOTH MODERN SHIELD (NO SHARP EDGES) ==================== -->
  <!-- Outer Shield Outline with Smooth Filleted Curves -->
  <path d="M 130,82 C 190,70 322,70 382,82 C 418,90 426,112 426,146 L 426,248 C 426,345 345,414 266,442 C 260,444 252,444 246,442 C 167,414 86,345 86,248 L 86,146 C 86,112 94,90 130,82 Z"
        fill="url(#shieldFill)"
        stroke="url(#shieldStroke)"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#cyanGlow)" />

  <!-- Inner Soft Bevel Contour -->
  <path d="M 142,106 C 196,96 316,96 370,106 C 398,112 404,130 404,156 L 404,242 C 404,324 335,385 264,412 C 259,414 253,414 248,412 C 177,385 108,324 108,242 L 108,156 C 108,130 114,112 142,106 Z"
        fill="none"
        stroke="#1E293B"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Subtle Shield Security Grid -->
  <path d="M 180,146 C 224,154 288,154 332,146 M 140,220 L 372,220 M 164,295 C 210,318 302,318 348,295 M 256,120 L 256,380"
        stroke="#0F213A"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none" />

  <!-- ==================== 2. MALWARE BUG ON THE SHIELD ==================== -->
  <g id="bug" filter="url(#bugGlow)">
    <!-- Bug Antennae with Smooth Drops -->
    <path d="M 216,170 C 204,146 186,142 176,148" stroke="#FF0055" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M 244,170 C 256,146 274,142 284,148" stroke="#FF0055" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <circle cx="176" cy="148" r="4.5" fill="#FF0055" />
    <circle cx="284" cy="148" r="4.5" fill="#FF0055" />

    <!-- 6 Smooth Cyber Legs (Softly Rounded Joints) -->
    <!-- Top Legs -->
    <path d="M 198,198 C 172,185 152,185 140,198" stroke="#FF0055" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 262,198 C 288,185 308,185 320,198" stroke="#FF0055" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Middle Legs -->
    <path d="M 192,234 C 160,234 144,242 134,258" stroke="#FF0055" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 268,234 C 300,234 316,242 326,258" stroke="#FF0055" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Bottom Legs -->
    <path d="M 198,270 C 168,288 155,302 148,318" stroke="#FF0055" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 262,270 C 292,288 305,302 312,318" stroke="#FF0055" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Bug Head -->
    <ellipse cx="230" cy="180" rx="18" ry="14" fill="#FF0055" />

    <!-- Bug Thorax -->
    <rect x="206" y="198" width="48" height="30" rx="8" fill="url(#bugGrad)" />

    <!-- Bug Abdomen (Rounded Segmented Shell) -->
    <path d="M 202,234 C 202,234 230,230 258,234 C 268,256 266,288 230,308 C 194,288 192,256 202,234 Z" fill="url(#bugGrad)" />

    <!-- Exoskeleton Wing Split -->
    <line x1="230" y1="232" x2="230" y2="306" stroke="#0C1322" stroke-width="3" stroke-linecap="round" />
    <line x1="208" y1="264" x2="252" y2="264" stroke="#0C1322" stroke-width="2.5" />

    <!-- Bug Glowing Infection Core -->
    <circle cx="230" cy="256" r="6" fill="#FFFFFF" />
    <circle cx="230" cy="256" r="3" fill="#FF0055" />
  </g>

  <!-- ==================== 3. MAGNIFYING GLASS FOCUSING ON BUG ==================== -->
  <g id="magnifier">
    <!-- Smooth Cyber Ergonomic Handle (Extending to Bottom-Right) -->
    <line x1="316" y1="316" x2="416" y2="416" stroke="#00E5FF" stroke-width="24" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="316" y1="316" x2="416" y2="416" stroke="#0A1424" stroke-width="14" stroke-linecap="round" />
    <line x1="354" y1="354" x2="408" y2="408" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" />
    <!-- Handle Grip Lines -->
    <line x1="364" y1="374" x2="374" y2="364" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" />
    <line x1="384" y1="394" x2="394" y2="384" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" />

    <!-- Joint Collar -->
    <circle cx="316" cy="316" r="14" fill="#00E5FF" />
    <circle cx="316" cy="316" r="8" fill="#0A1424" />

    <!-- Magnifier Lens Rim (Heavy Smooth Circular Bezel) -->
    <circle cx="230" cy="230" r="105" fill="none" stroke="url(#lensRim)" stroke-width="16" filter="url(#cyanGlow)" />
    <circle cx="230" cy="230" r="113" fill="none" stroke="#00E5FF" stroke-width="2" />

    <!-- Lens Glass Surface -->
    <circle cx="230" cy="230" r="97" fill="url(#lensGlass)" />

    <!-- Glass Curved Highlights -->
    <path d="M 165,160 C 185,145 220,140 255,145" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8" fill="none" />
    <path d="M 152,185 C 162,175 178,168 195,165" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.5" fill="none" />

    <!-- ==================== 4. FOCUS LOCK CROSSHAIRS ==================== -->
    <!-- Dotted Targeting Reticle -->
    <circle cx="230" cy="230" r="75" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-dasharray="14 10" stroke-opacity="0.85" />

    <!-- Precision Sight Ticks -->
    <line x1="230" y1="135" x2="230" y2="155" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="230" y1="305" x2="230" y2="325" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="135" y1="230" x2="155" y2="230" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />
    <line x1="305" y1="230" x2="325" y2="230" stroke="#00E5FF" stroke-width="4.5" stroke-linecap="round" filter="url(#cyanGlow)" />

    <!-- Emerald Targeting Lock Brackets -->
    <path d="M 185,195 L 185,185 L 195,185" stroke="#00E676" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 275,195 L 275,185 L 265,185" stroke="#00E676" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 185,265 L 185,275 L 195,275" stroke="#00E676" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 275,265 L 275,275 L 265,275" stroke="#00E676" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
