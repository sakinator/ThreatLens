<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#070A10"/>
    </radialGradient>

    <!-- Neon Cyan to Emerald Gradient -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Crimson Threat Accent -->
    <linearGradient id="threatCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>

    <!-- Outer Shield Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#1E2C48" stroke-width="2"/>

  <!-- Outer Cyber Shield Contour -->
  <path d="M 256,60 
           C 340,60 410,95 410,180 
           C 410,300 320,390 256,440 
           C 192,390 102,300 102,180 
           C 102,95 172,60 256,60 Z" 
        fill="#0D1322" 
        stroke="url(#cyberCyan)" 
        stroke-width="6" 
        stroke-linecap="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Cyber Grid Shield -->
  <path d="M 256,90 
           C 320,90 380,120 380,190 
           C 380,285 305,365 256,408 
           C 207,365 132,285 132,190 
           C 132,120 192,90 256,90 Z" 
        fill="none" 
        stroke="#1E2E4E" 
        stroke-width="2" 
        stroke-dasharray="6,6"/>

  <!-- Optical Camera / Lens Aperture Blades (The "Lens") -->
  <circle cx="256" cy="225" r="95" fill="#090E1A" stroke="url(#cyberCyan)" stroke-width="3"/>
  <circle cx="256" cy="225" r="80" fill="none" stroke="#1F3356" stroke-width="2"/>

  <!-- Aperture Iris Segments -->
  <g stroke="url(#cyberCyan)" stroke-width="2.5" fill="none" opacity="0.85">
    <line x1="256" y1="145" x2="315" y2="185"/>
    <line x1="335" y1="225" x2="295" y2="285"/>
    <line x1="256" y1="305" x2="195" y2="265"/>
    <line x1="175" y1="225" x2="215" y2="165"/>
  </g>

  <!-- Central Optical Core / Scanner Target -->
  <circle cx="256" cy="225" r="46" fill="#0F182B" stroke="#00F0FF" stroke-width="3"/>
  <circle cx="256" cy="225" r="28" fill="url(#cyberCyan)"/>

  <!-- Crosshair Scope Reticle -->
  <line x1="256" y1="125" x2="256" y2="160" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="290" x2="256" y2="325" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="156" y1="225" x2="191" y2="225" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>
  <line x1="321" y1="225" x2="356" y2="225" stroke="#00F0FF" stroke-width="4" stroke-linecap="round"/>

  <!-- Radar Pulse Beam -->
  <path d="M 256,225 L 320,165 A 95,95 0 0,0 256,130 Z" fill="url(#cyberCyan)" opacity="0.25"/>

  <!-- Lower Threat Indicator Dot -->
  <circle cx="256" cy="385" r="6" fill="#00E676" filter="url(#neonGlow)"/>
</svg>
