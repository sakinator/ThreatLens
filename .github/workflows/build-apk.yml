name: Build ThreatLens APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ThreatLens Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APK with Gradle
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate and Prepare APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/ThreatLens.apk \;

      - name: Upload ThreatLens APK
        uses: actions/upload-artifact@v4
        with:
          name: ThreatLens-Android-APK
          path: release_output/ThreatLens.apk
          if-no-files-found: warn
