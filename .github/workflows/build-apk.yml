name: Build ThreatLens APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ThreatLens Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run Codebase Auditor & Syntax Regression Suite
        run: |
          python3 tools/codebase_auditor.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK with Permanent Keystore Signature
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Locate and Prepare APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/ThreatLens.apk \;
          ls -la release_output/

      - name: Upload ThreatLens APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreatLens-Android-APK
          path: release_output/ThreatLens.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }}
          name: ThreatLens ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0' }} — Real App Identity, VPN Defense & Enhanced Controls
          draft: false
          prerelease: false
          files: release_output/ThreatLens.apk
          body: |
            ## 🛡️ ThreatLens Release
            
            ### 🚀 Highlights:
            * **Real Application Identity & App Logos**: Displays human-readable app titles (e.g. WhatsApp, Google Chrome) instead of generic `base.apk`, with actual Android app icons loaded dynamically and detected APK names preserved.
            * **Uninstall vs Delete Action Separation**: Distinguishes between installed apps and downloaded APK files. Installed apps trigger Android's system uninstaller, while downloaded APKs are permanently deleted from storage. Misleading "quarantine" labels eliminated.
            * **Confirmation Dialogs & Action Toasts**: Added confirmation popups before uninstalling apps or deleting files to prevent accidental removal, complete with instant Toast notifications.
            * **Full Scan Threat Details & Multi-Source Engine Breakdown**: Clicking any threat in Full Scan opens a comprehensive bottom sheet detailing exact verdicts from each individual engine (ThreatLens Local Engine, MalwareBazaar, VirusTotal, MetaDefender, Hybrid Analysis, Kaspersky OpenTIP, Filescan.io).
            * **Scan Progress & Device Risk Layout**: Active percentage and item count gauge remains visible during scans. When threats are flagged in-progress, a prominent "Device at Risk" alert sits neatly under the progress ring, taking full space only upon scan completion.
            * **Pause, Resume & Abort Controls**: On-demand system scans can now be paused, resumed, or cleanly aborted at any moment.
            * **API Keys Validation & Portal Hyperlinks**: Each key setting includes a direct "Get key here ↗" portal hyperlink, individual "Validate & Save" testing with live HTTP status indicators, and a bulk "SAVE & VALIDATE ALL KEYS" option.
            * **Fresh Regional News for India**: Upgraded geolocation to HTTPS and integrated CERT-In, digital arrest, and Indian banking fraud feeds (`when:7d`, `hl=en-IN`), displaying human-friendly relative time ("2h ago", "Today").
            * **Fixed VPN Crash on Android 14**: Added `FOREGROUND_SERVICE_SPECIAL_USE` permissions, defensive service wrappers, and standard subnet prefixing (`10.111.222.1/24`).
            * **Minimalist Blue Shield Logo**: Sleek, modern electric blue and neon cyan shield on deep cyber black background (`#070B14`) matching app internals.
            * **Signed Release Build**: Permanent keystore signature (`release.jks`) for seamless update over previous installations.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
