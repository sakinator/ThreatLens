name: Build ThreatLens APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ThreatLens Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run Codebase Auditor & Syntax Regression Suite
        run: |
          python3 tools/codebase_auditor.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK with Permanent Keystore Signature
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Locate and Prepare APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/ThreatLens.apk \;
          ls -la release_output/

      - name: Upload ThreatLens APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreatLens-Android-APK
          path: release_output/ThreatLens.apk
          if-no-files-found: error

      - name: Extract Release Notes from Changelog
        run: |
          python3 tools/extract_release_notes.py "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.5.6' }}"

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ThreatLens ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_output/ThreatLens.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
